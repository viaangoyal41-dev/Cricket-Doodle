<!DOCTYPE html>
<html>
<head>
    <title>🏏 Cricket Doodle - Hit the Ball!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #87CEEB;
        }

        h1 {
            margin: 15px;
            color: white;
            text-shadow: 2px 2px 4px #555;
        }

        #score {
            font-size: 22px;
            font-weight: bold;
            margin: 10px;
        }

        #game {
            width: 700px;
            height: 420px;
            max-width: 95%;
            margin: auto;
            position: relative;
            overflow: hidden;
            border: 5px solid white;
            border-radius: 15px;
            background: linear-gradient(#65c466 0%, #65c466 65%, #d8b26e 65%);
        }

        #pitch {
            position: absolute;
            width: 500px;
            height: 110px;
            left: 100px;
            bottom: 90px;
            background: #d8b26e;
            border: 3px solid #c49a5a;
        }

        #batsman {
            position: absolute;
            left: 100px;
            bottom: 150px;
            font-size: 65px;
            transition: transform 0.1s;
        }

        #bat {
            position: absolute;
            left: 155px;
            bottom: 155px;
            font-size: 60px;
            transform: rotate(-25deg);
        }

        #ball {
            position: absolute;
            left: 600px;
            bottom: 175px;
            font-size: 28px;
        }

        #message {
            position: absolute;
            top: 35px;
            width: 100%;
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px black;
        }

        #startScreen,
        #gameOver {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.65);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #gameOver {
            display: none;
        }

        button {
            padding: 12px 25px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        button:hover {
            background: gold;
        }

        #instructions {
            font-size: 18px;
        }

        @media (max-width: 600px) {
            #game {
                height: 350px;
            }

            #pitch {
                width: 80%;
                left: 10%;
            }
        }
    </style>
</head>

<body>

    <h1>🏏 CRICKET DOODLE 🏏</h1>

    <div id="score">
        Runs: 0 | Wickets: 0/3
    </div>

    <div id="game">

        <div id="pitch"></div>

        <div id="batsman">🧑</div>

        <div id="bat">🏏</div>

        <div id="ball">🔴</div>

        <div id="message"></div>

        <div id="startScreen">
            <h2>🏏 Hit the Ball!</h2>
            <p>Press SPACE when the ball reaches the bat!</p>
            <button onclick="startGame()">PLAY</button>
        </div>

        <div id="gameOver">
            <h2>🏆 GAME OVER!</h2>
            <p id="finalScore"></p>
            <button onclick="startGame()">PLAY AGAIN</button>
        </div>

    </div>

    <p id="instructions">
        ⌨️ Press <b>SPACE</b> to hit the ball
    </p>


<script>

let ball = document.getElementById("ball");
let bat = document.getElementById("bat");
let message = document.getElementById("message");

let scoreText = document.getElementById("score");
let startScreen = document.getElementById("startScreen");
let gameOver = document.getElementById("gameOver");
let finalScore = document.getElementById("finalScore");

let ballX;
let speed;
let score;
let wickets;

let playing = false;
let ballMoving = false;
let ballTimer;


function startGame() {

    score = 0;
    wickets = 0;

    playing = true;

    startScreen.style.display = "none";
    gameOver.style.display = "none";

    message.innerHTML = "";

    updateScore();

    bowl();
}


function updateScore() {

    scoreText.innerHTML =
        "Runs: " + score +
        " | Wickets: " + wickets + "/3";
}


function bowl() {

    if (!playing) return;

    ballMoving = true;

    ballX = 600;

    ball.style.left = ballX + "px";

    speed = 3 + Math.min(score / 30, 4);

    moveBall();
}


function moveBall() {

    if (!ballMoving || !playing) return;

    ballX -= speed;

    ball.style.left = ballX + "px";


    if (ballX <= 155) {

        ballMoving = false;

        missBall();

        return;
    }

    ballTimer = requestAnimationFrame(moveBall);
}


function hitBall() {

    if (!playing || !ballMoving) return;

    if (ballX >= 120 && ballX <= 230) {

        ballMoving = false;

        cancelAnimationFrame(ballTimer);

        bat.style.transform =
            "rotate(35deg)";

        setTimeout(function() {

            bat.style.transform =
                "rotate(-25deg)";

        }, 150);


        let runs =
            Math.floor(Math.random() * 4) + 1;

        score += runs;

        message.innerHTML =
            "🏏 +" + runs + " RUN" +
            (runs > 1 ? "S!" : "!");


        updateScore();


        setTimeout(function() {

            message.innerHTML = "";

            if (playing) {
                bowl();
            }

        }, 700);

    }
}


function missBall() {

    wickets++;

    message.innerHTML = "❌ OUT!";

    updateScore();


    if (wickets >= 3) {

        endGame();

        return;
    }


    setTimeout(function() {

        message.innerHTML = "";

        if (playing) {
            bowl();
        }

    }, 900);
}


function endGame() {

    playing = false;
    ballMoving = false;

    cancelAnimationFrame(ballTimer);

    finalScore.innerHTML =
        "You scored <b>" + score +
        " runs</b>!";

    gameOver.style.display = "flex";
}


document.addEventListener("keydown", function(event) {

    if (event.code === "Space") {

        event.preventDefault();

        hitBall();
    }

});


/* Mobile/touch support */

document.getElementById("game").addEventListener("click", function() {

    if (playing) {
        hitBall();
    }

});

</script>

</body>
</html>
